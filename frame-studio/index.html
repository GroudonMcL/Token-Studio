<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design code-drawn token frames visually, layer by layer." />
    <meta name="theme-color" content="#0f1a2e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Frame Studio</title>
    <script>
      // Token Studio's colour scheme (src/shell/palettes.css), also before the page paints.
      try {
        document.documentElement.setAttribute('data-palette', localStorage.getItem('ts.palette') || 'lamplit');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frame-studio/main.tsx"></script>
  </body>
</html>
